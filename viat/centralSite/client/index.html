<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Anchor every relative URL to the site root so SPA routes like
			 /swap/ don't resolve assets against the current pathname. -->
		<base href="/" />
		<title>⩝ VIAT :: TERMINAL: COMMAND & CONTROL</title>
		<!-- App pair — swap these two hrefs to load a different app. -->
		<link rel="stylesheet" href="/apps/wallet/index.css" />
		<!-- No theme <link> here on purpose: theme-select/theme-manager.js creates
			 and swaps the link[data-uwc-id="theme"] sheet itself. -->
		<!-- Import map must appear before any module that uses the mapped specifier -->
		<script type="importmap">
			{
				"imports": {
					"@universalweb/utilitylib": "/scripts/utils.js",
					"viat": "/scripts/viat-client-sdk-bundle.js",
					"webcomponent": "/components/core/index.js"
				}
			}
		</script>
		<script type="module" src="/apps/wallet/index.js?v=260715boot"></script>
	</head>

	<body></body>
</html>
